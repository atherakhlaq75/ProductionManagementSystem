<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 54" width="214" height="54">
  <!-- Outer ring (full closed circle) -->
  <circle cx="27" cy="27" r="25" fill="none" stroke="#196bab" stroke-width="2"/>

  <!-- Three concentric C-arcs opening to the right (120° gap, sweep CCW the long way) -->
  <!-- Arc 1: r=18.5 — start at 300°, end at 60° -->
  <path d="M 36.25 10.98 A 18.5 18.5 0 1 0 36.25 43.02"
        fill="none" stroke="#196bab" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Arc 2: r=12 -->
  <path d="M 33 16.61 A 12 12 0 1 0 33 37.39"
        fill="none" stroke="#196bab" stroke-width="3" stroke-linecap="round"/>
  <!-- Arc 3: r=6 -->
  <path d="M 30 21.80 A 6 6 0 1 0 30 32.20"
        fill="none" stroke="#196bab" stroke-width="2.5" stroke-linecap="round"/>

  <!-- CKDL wordmark -->
  <text x="60" y="33"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="900" fill="#196bab" letter-spacing="1">CKDL</text>

  <!-- Tagline -->
  <text x="61" y="46"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="9" fill="#196bab" letter-spacing="0.3" opacity="0.85">Croydon Kowloon Designs Ltd.</text>
</svg>
